version = 1
revision = 3
requires-python = ">=3.11"

[[package]]
name = "app"
version = "1.0"
source = { virtual = "." }
dependencies = [{ name = "common" }, { name = "library", extra = ["one"] }]

[package.optional-dependencies]
api = [{ name = "api", marker = "extra == 'api'" }, { name = "library", extra = ["two"] }, { name = "winonly", marker = "sys_platform == 'win32'" }]
gpu = [{ name = "gpu" }]

[package.dev-dependencies]
dev = [{ name = "devtool" }]
docs = [{ name = "docstool" }]

[[package]]
name = "library"
version = "1.0"
source = { registry = "https://pypi.org/simple" }
wheels = [{ url = "https://example.invalid/library-1.0-py3-none-any.whl" }]
dependencies = [{ name = "librarybase" }]
[package.optional-dependencies]
one = [{ name = "one" }]
two = [{ name = "two", marker = "extra == 'two' and extra != 'one'" }]
three = [{ name = "three" }]
unused = [{ name = "unused" }]

[[package]]
name = "two"
version = "1.0"
source = { registry = "https://pypi.org/simple" }
wheels = [{ url = "https://example.invalid/two-1.0-py3-none-any.whl" }]
dependencies = [{ name = "library", extra = ["three"] }]

